# Full dev stack: backend (FastAPI), frontend (Vite).
# From project root: docker compose run frontend npm install  (once)
#                    docker compose build
#                    docker compose up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: invasive-tracker-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    container_name: invasive-tracker-frontend
